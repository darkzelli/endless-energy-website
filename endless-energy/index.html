<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/endless-energy/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/endless-energy/icon-180.png">
<title>Endless Energy</title>
<meta name="description" content="A puzzle game about wiring loops. Make a loop, then pull the plug.">
<script type="module" src="/src/main.js"></script>
</head>
<body>
<!-- header -->
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Make a loop.<br><span>Pull the plug.</span></h1>
      <p>Plug in the generator, power every strip, then pull the plug. If the power keeps flowing on its own, you've solved it. A puzzle game built around one idea: energy that never runs out.</p>
      <div class="cta">
        <a class="store-badge" href="https://apps.apple.com/app/id6825624984"><img src="/endless-energy/app-store-badge.svg" alt="Download on the App Store" width="180" height="60"></a>
      </div>
    </div>
    <div class="phones">
      <div class="phone back">
        <div class="device device-iphone-14-pro">
          <div class="device-frame"><img class="device-screen" src="/endless-energy/screens/levels.jpg" alt="The levels page: lit strips wired up the screen, the next level glowing"></div>
          <div class="device-stripe"></div><div class="device-header"></div><div class="device-sensors"></div>
          <div class="device-btns"></div><div class="device-power"></div>
        </div>
      </div>
      <div class="phone front">
        <div class="device device-iphone-14-pro">
          <div class="device-frame"><img class="device-screen" src="/endless-energy/screens/hero.png" alt="Endless Energy: red and blue generators, and strips looped in purple and red, every face smiling"></div>
          <div class="device-stripe"></div><div class="device-header"></div><div class="device-sensors"></div>
          <div class="device-btns"></div><div class="device-power"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="screens">
    <h2>How to play</h2>
    <p>Three steps to endless energy.</p>
    <div class="gallery">
      <figure class="step">
        <img class="step-art" src="/endless-energy/steps/step1.png" alt="Connect the generator" width="360" height="360" loading="lazy">
        <figcaption><span class="num">1</span><strong>Connect the generator</strong><span class="desc">Tap the <b>generator</b>, then the <b>strip</b>.</span></figcaption>
      </figure>
      <figure class="step">
        <img class="step-art" src="/endless-energy/steps/step2.png" alt="Loop the power" width="360" height="360" loading="lazy">
        <figcaption><span class="num">2</span><strong>Loop the power</strong><span class="desc">Tap two of the strip's sockets.</span></figcaption>
      </figure>
      <figure class="step">
        <img class="step-art" src="/endless-energy/steps/step3.png" alt="Endless Energy achieved!" width="360" height="360" loading="lazy">
        <figcaption><span class="num">3</span><strong>Pull the plug</strong><span class="desc">Tap the <b>generator</b>'s plug. The strip powers itself forever: Endless Energy!</span></figcaption>
      </figure>
    </div>
  </section>
</main>
<!-- footer -->
</body>
</html>
